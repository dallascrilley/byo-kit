# Post-merge smoke on Depot CI (Workspace ADR-0020 and ADR-0021).
# One small sandbox per landing on main; docs-only commits start nothing.
# Tests run on the oldest and newest supported Node in one job.
#
#   on demand : depot ci run --workflow .depot/workflows/ci.yml
#   local     : script/cibuild
name: ci

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "relay/**"
      - "test/**"
      - "example/**"
      - "tools/**"
      - "templates/**"
      - "scripts/**"
      - "script/**"
      - "dist/**"
      - "package.json"
      - ".depot/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node 20
        run: script/cibuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node 22
        run: script/cibuild
